# ═══════════════════════════════════════════════════════════════════
# menu.schema.yaml
# L2 菜单来源配置文件（<PRIVATE_ROOT>/menus/<code>.yaml）的 JSON Schema 定义。
# 与 project.schema.yaml 平级：菜单来源独立成文件，换菜单来源只改此文件。
# 校验子集与 scripts/validate-project.mjs 一致（type/required/enum/const/
# oneOf/additionalProperties:false ...），不使用 not / if-then。
# ═══════════════════════════════════════════════════════════════════
$schema: "http://json-schema.org/draft-07/schema#"
$id: "https://example.invalid/supper-han-java/menu.schema.yaml"
title: "L2 Menu Source Contract"
description: "Menu-learning data source for a single project; consumed by /supperH-learn menu mode."
type: object
additionalProperties: false
required:
  - schemaVersion
  - project
  - source

properties:
  schemaVersion:
    type: integer
    const: 1
    description: "Structure version; mismatch blocks read."

  project:
    type: string
    pattern: "^[a-z][a-z0-9-]{1,30}$"
    description: "Must equal the project identity.code; filename is <project>.yaml."

  source:
    enum: [database, code]
    description: "Where menu items come from. Required, no default."

  database:
    type: object
    additionalProperties: false
    required: [table, columns]
    properties:
      slot:
        type: string
        description: "Reused driver slot (default 'database')."
      source:
        type: string
        description: "Driver logical source name; must be declared in drivers.database.config.sources."
      table:
        type: string
        minLength: 1
        description: "Menu table name (e.g. sys_menu)."
      columns:
        type: object
        additionalProperties: false
        required: [id, parentId, name, path]
        description: "Column mapping; the route/path column is mandatory."
        properties:
          id:       { type: string, minLength: 1 }
          parentId: { type: string, minLength: 1 }
          name:     { type: string, minLength: 1 }
          path:     { type: string, minLength: 1 }
          order:    { type: string }
      rootParentId:
        type: string
        description: "Optional: filter to a root parent id."
      extraFilter:
        type: string
        description: "Optional: SELECT-only WHERE fragment."
      limit:
        type: integer
        minimum: 1

  code:
    type: object
    additionalProperties: false
    required: [path, format]
    properties:
      path:
        type: string
        minLength: 1
        description: "Absolute path, or relative to codeRoot."
      format:
        enum: [json, sql, properties, router]
      columns:
        type: object
        description: "Column/key mapping for non-tabular formats."
        properties:
          id:       { type: string }
          parentId: { type: string }
          name:     { type: string }
          path:     { type: string }

# Mutually-exclusive branch by source. Enforced via discriminating enum so that
# exactly one subschema matches for a given source value.
oneOf:
  - required: [database]
    properties:
      source: { enum: [database] }
  - required: [code]
    properties:
      source: { enum: [code] }
