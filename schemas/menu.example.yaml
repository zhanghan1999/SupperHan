# ═══════════════════════════════════════════════════════════════════
# menu.example.yaml
# 菜单来源配置模板（假数据）。用户 clone 后由 /supperH-init 落盘到
#   <PRIVATE_ROOT>/menus/<code>.yaml
# 声明 /supperH-learn 菜单模式的数据来源：database（DB 表）或 code（代码文件）。
# 菜单学习的本质：菜单项 → 其指向的页面路径 → 后端路由/代码。
# ═══════════════════════════════════════════════════════════════════
schemaVersion: 1
project: example-proj        # 必须等于项目 identity.code
source: database             # database | code（必填）

database:
  slot: database             # 可选：没答这一项时 /supperH-init 会**删掉这一行**（不沿用本行示例值）；不写此键 = 用数据库通道（`role: database` 那个槽位，名字归用户）。要显式写就得跟 `projects/<code>.yaml` 里实际登记的那个槽位名一致，不能照抄这里的 `database`
  source: menu               # driver 逻辑源名，须在数据库槽位（role: database）的 config.sources 声明
  table: sys_menu
  columns:                   # 列名映射（指向路径列 path 必填）
    id: menu_id
    parentId: parent_id
    name: menu_name
    path: path               # 关键：页面指向路径
    order: order_num         # 可选
  rootParentId: "0"          # 可选：根节点过滤
  extraFilter: ""            # 可选：SELECT-only 的 WHERE 片段
  limit: 5000

code:
  path: "src/main/resources/menu/menu.json"   # 绝对路径，或相对 codeRoot
  format: json               # json | sql | properties | router
  columns: { id: id, parentId: parentId, name: name, path: path }
